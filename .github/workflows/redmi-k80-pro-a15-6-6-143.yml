name: Redmi K80 Pro - BakaSU SUSFS (6.6.143)

on:
  workflow_dispatch:

permissions:
  # The reusable build workflow declares these permissions; callers may only
  # keep or reduce them, never elevate them.
  contents: write
  actions: write

jobs:
  build-redmi-k80-pro:
    # 两个方案分别在独立 runner 编译，产物互不覆盖。
    name: 6.6.143-android15-8 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 方案 1：保守基线，不叠加内存压缩补丁。
          - name: "方案 1 - BakaSU SUSFS"
            use_zram: false
            artifact_suffix: baseline
          # 方案 2：仅在保守基线上启用 ZRAM/LZ4KD。
          - name: "方案 2 - BakaSU SUSFS + LZ4KD"
            use_zram: true
            artifact_suffix: lz4kd
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android15
      kernel_version: "6.6"
      sub_level: "143"
      os_patch_level: lts
      ksu_variant: BakaSU
      ksu_branch: main
      artifact_suffix: ${{ matrix.artifact_suffix }}
      clean_build: false
      # 方案 2 启用 LZ4KD 压缩后端，改善内存紧张时的 ZRAM 交换性能。
      use_zram: ${{ matrix.use_zram }}
      use_bbg: false
      use_rekernel: false
      cve_2026_43499_patch: true
      enable_susfs: true
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false
      build_bypass: false
