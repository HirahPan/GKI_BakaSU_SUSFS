name: Redmi K80 Pro - BakaSU SUSFS + LZ4KD (6.6.143)

on:
  workflow_dispatch:

permissions:
  # The reusable build workflow declares these permissions; callers may only
  # keep or reduce them, never elevate them.
  contents: write
  actions: write

jobs:
  build-redmi-k80-pro:
    # 方案 2：在保守基线中仅启用 ZRAM/LZ4KD，避免叠加实验性补丁。
    name: 6.6.143-android15-8 BakaSU SUSFS + LZ4KD
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android15
      kernel_version: "6.6"
      sub_level: "143"
      os_patch_level: lts
      ksu_variant: BakaSU
      ksu_branch: main
      clean_build: false
      # 启用 LZ4KD 压缩后端，改善内存紧张时的 ZRAM 交换性能。
      use_zram: true
      use_bbg: false
      use_rekernel: false
      cve_2026_43499_patch: true
      enable_susfs: true
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false
      build_bypass: false
